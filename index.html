<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Invotora — Editable SVG Invitation Editor</title>
    <meta
      name="description"
      content="Upload your Etsy editable SVG design, customize real vector text, fonts, shapes, colors, and layers directly in your browser, and download your editable SVG."
    />
    <meta property="og:title" content="Invotora — Editable SVG Invitation Editor" />
    <meta
      property="og:description"
      content="Upload your Etsy editable SVG design, customize real vector text, fonts, shapes, colors, and layers directly in your browser, and download your editable SVG."
    />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('invitora:theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F4F5] text-[#111111] dark:bg-[#090909] dark:text-[#F5F5F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
