<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" data-theme="neon-noir">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyberDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#FF007F" flood-opacity="0.7" />
    </filter>
    <filter id="glitchWarp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.15" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <mask id="scanlineMask">
      <rect x="0" y="0" width="900" height="600" fill="#FFFFFF" />
      <rect x="0" y="240" width="900" height="14" fill="#000000" />
      <rect x="0" y="270" width="900" height="10" fill="#000000" />
    </mask>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#070812" />

  <g transform="translate(40, 40)" mask="url(#scanlineMask)">
    <defs>
      <clipPath id="nestedHexClip">
        <polygon points="80,0 760,0 820,60 820,460 760,520 80,520 20,460 20,60" />
      </clipPath>
    </defs>
    <rect x="20" y="0" width="800" height="520" fill="#10152B" clip-path="url(#nestedHexClip)" stroke="#00F0FF" stroke-width="2" stroke-dasharray="10 4" />
  </g>

  <g mix-blend-mode="screen" transform="translate(450, 220) rotate(-3)">
    <circle cx="-40" cy="0" r="90" fill="#00F0FF" fill-opacity="0.6" filter="url(#neonGlow)" />
    <circle cx="40" cy="0" r="90" fill="#FF007F" fill-opacity="0.6" style="mix-blend-mode: lighten" />
  </g>

  <text x="450" y="250" text-anchor="middle" font-family="Bebas Neue" font-size="76" fill="#00F0FF" filter="url(#cyberDropShadow)">
    CYBER NIGHT 2077
  </text>

  <text x="450" y="340" text-anchor="middle" font-family="JetBrains Mono" font-size="22" fill="#FF2A9D" filter="url(#glitchWarp)">
    <tspan>SECTOR</tspan>
    <tspan dx="10">09</tspan>
    <tspan dx="10">//</tspan>
    <tspan dx="10">LIVE</tspan>
  </text>
</svg>
